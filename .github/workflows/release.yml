name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write # 允许创建 Release

    steps:
      - name: Checkout code
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # 后续步骤均用显式 token，不残留凭证到本地 git 配置
          persist-credentials: false

      - name: Build Release
        run: swift build -c release

      - name: Prepare App Bundle
        run: |
          # 从 Packaging/ 模板现场组装 .app（Dist/ 已移出版本库）
          APP=Dist/ChargingPowerTool.app
          PLIST="$APP/Contents/Info.plist"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp .build/release/ChargingPowerTool "$APP/Contents/MacOS/"
          cp Packaging/Info.plist "$PLIST"
          cp Packaging/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"

          # 从 tag 中获取版本号 (例如 v1.2.1 -> 1.2.1)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "Release Version: $VERSION"

          # 更新 Info.plist 中的版本号
          PB=/usr/libexec/PlistBuddy
          $PB -c "Set :CFBundleVersion $VERSION" "$PLIST"
          $PB -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"

      - name: Ad-hoc Sign
        run: |
          # 进行本地 Ad-hoc 签名，避免“应用已损坏”提示
          codesign --force --deep -s - Dist/ChargingPowerTool.app

      - name: Package (Zip & DMG)
        run: |
          cd Dist
          # 创建 Zip
          zip -r ChargingPowerTool.zip ChargingPowerTool.app

          # 创建 DMG
          hdiutil create -volname "ChargingPowerTool" \
            -srcfolder "ChargingPowerTool.app" -ov -format UDZO \
            "ChargingPowerTool.dmg"

          # 计算 SHA256 并保存到环境变量，供后续步骤使用
          SHASUM=$(shasum -a 256 ChargingPowerTool.dmg | awk '{print $1}')
          echo "SHA256=$SHASUM" >> $GITHUB_ENV
          echo "Calculated SHA256: $SHASUM"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF" >/dev/null 2>&1; then
            # 已存在则只覆盖上传资产（支持重跑）
            gh release upload "$GITHUB_REF" --clobber \
              Dist/ChargingPowerTool.zip \
              Dist/ChargingPowerTool.dmg
          else
            gh release create "$GITHUB_REF" --title "$GITHUB_REF" \
              --generate-notes \
              Dist/ChargingPowerTool.zip \
              Dist/ChargingPowerTool.dmg
          fi

      - name: Update Homebrew Tap
        if: success()
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SHA256: ${{ env.SHA256 }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::TAP_TOKEN not set, skip tap update."
            exit 0
          fi

          VERSION=${GITHUB_REF#refs/tags/v}

          # 克隆 Tap 仓库
          TOKEN_URL="https://x-access-token:${TAP_TOKEN}@github.com"
          git clone "${TOKEN_URL}/Feng-H/homebrew-tap.git" tap-repo
          cd tap-repo

          # 更新 Cask 文件中的 version 和 sha256
          sed -i.bak "s/version \".*\"/version \"$VERSION\"/" \
            Casks/chargingpowertool.rb
          sed -i.bak "s/sha256 \".*\"/sha256 \"$SHA256\"/" \
            Casks/chargingpowertool.rb
          rm Casks/chargingpowertool.rb.bak

          # 检查内容变更
          cat Casks/chargingpowertool.rb

          # 提交并推送
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add Casks/chargingpowertool.rb

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update ChargingPowerTool to v$VERSION"
            git push
          fi
